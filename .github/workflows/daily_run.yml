name: ETF Arbitrage Monitor

on:
  schedule:
    # --- 第一班车：早盘盯盘 (覆盖 07:40 - 13:40) ---
    # 🕒 UTC 23:40 = 北京时间 07:40
    # ⚠️ 星期：UTC 周日~周四 = 北京 周一~周五
    - cron: '40 23 * * 0-4'

    # --- 第二班车：午盘/下午接力 (覆盖 13:40 - 19:40) ---
    # 🕒 UTC 05:40 = 北京时间 13:40 (第一班跑了6小时刚好到这时)
    # ⚠️ 星期：UTC 周一~周五 = 北京 周一~周五 (因为过了午夜，日期对上了)
    - cron: '40 5 * * 1-5'

  # 允许你手动点击按钮测试
  workflow_dispatch:

jobs:
  run_monitor:
    runs-on: ubuntu-latest

    # 设置超时时间 360分钟(6小时)，刚好让两班车无缝衔接
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # 开启缓存，安装更快

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Monitor Script
        env:
          # 强制设置时区为北京时间
          TZ: 'Asia/Shanghai'
        run: |
          python main.py
